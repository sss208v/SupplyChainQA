<svg width="960" height="820" viewBox="0 0 960 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b82f6"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a855f7"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px} .title{font-size:16px;font-weight:700;fill:#1e293b} .small{font-size:11px;fill:#64748b} .tiny{font-size:9px;fill:#94a3b8}</style>
  </defs>
  <rect width="960" height="820" fill="#f8fafc" rx="8"/>

  <!-- ====== Connections ====== -->
  <!-- User → Frontend -->
  <line x1="480" y1="48" x2="480" y2="82" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <!-- Frontend → API Gateway -->
  <line x1="480" y1="130" x2="480" y2="168" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- API → Router -->
  <line x1="480" y1="218" x2="480" y2="256" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Router branches -->
  <!-- RAG path -->
  <line x1="420" y1="306" x2="160" y2="360" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- TOOL path -->
  <line x1="480" y1="306" x2="480" y2="360" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- GOAL path -->
  <line x1="540" y1="306" x2="800" y2="360" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- GOAL: Orchestrator → Agents -->
  <line x1="800" y1="410" x2="650" y2="470" stroke="#f59e0b" stroke-width="1" marker-end="url(#arrow-orange)"/>
  <line x1="800" y1="410" x2="740" y2="470" stroke="#f59e0b" stroke-width="1" marker-end="url(#arrow-orange)"/>
  <line x1="800" y1="410" x2="860" y2="470" stroke="#f59e0b" stroke-width="1" marker-end="url(#arrow-orange)"/>
  <line x1="800" y1="410" x2="950" y2="470" stroke="#f59e0b" stroke-width="1" marker-end="url(#arrow-orange)"/>

  <!-- RAG → Milvus -->
  <line x1="130" y1="410" x2="80" y2="560" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <!-- RAG → Redis -->
  <line x1="160" y1="410" x2="160" y2="560" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <!-- RAG → PostgreSQL -->
  <line x1="190" y1="410" x2="240" y2="560" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- TOOL: Agent → Tools -->
  <line x1="480" y1="410" x2="480" y2="560" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Domain Agents → Tools -->
  <line x1="650" y1="520" x2="560" y2="560" stroke="#64748b" stroke-width="1" marker-end="url(#arrow-slate)"/>
  <line x1="740" y1="520" x2="560" y2="560" stroke="#64748b" stroke-width="1" marker-end="url(#arrow-slate)"/>
  <line x1="860" y1="520" x2="560" y2="560" stroke="#64748b" stroke-width="1" marker-end="url(#arrow-slate)"/>
  <line x1="950" y1="520" x2="560" y2="560" stroke="#64748b" stroke-width="1" marker-end="url(#arrow-slate)"/>

  <!-- ====== RBAC Cross-Cutting (dashed, right side) ====== -->
  <rect x="600" y="580" width="340" height="42" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="770" y="606" text-anchor="middle" fill="#dc2626" font-size="12">RBAC 权限层 (横切关注点)</text>
  <line x1="380" y1="601" x2="598" y2="601" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- ====== Components ====== -->

  <!-- User -->
  <rect x="410" y="8" width="140" height="40" rx="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="33" text-anchor="middle" fill="#475569" font-size="13">用户 (浏览器)</text>

  <!-- Vue3 Frontend -->
  <rect x="390" y="90" width="180" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="115" text-anchor="middle" fill="#1e40af" font-size="13">Vue3 前端 (端口 3000)</text>

  <!-- FastAPI Backend -->
  <rect x="390" y="178" width="180" height="40" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="203" text-anchor="middle" fill="#166534" font-size="13">FastAPI 后端 (端口 8001)</text>

  <!-- Intent Router -->
  <rect x="390" y="266" width="180" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="291" text-anchor="middle" fill="#92400e" font-size="13">意图路由器 (3级匹配)</text>

  <!-- RAG Agent -->
  <rect x="100" y="370" width="120" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="395" text-anchor="middle" fill="#1e40af" font-size="12">RAG Agent</text>

  <!-- Tool Agent -->
  <rect x="420" y="370" width="120" height="40" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="395" text-anchor="middle" fill="#166534" font-size="12">Tool Agent</text>

  <!-- Orchestrator -->
  <rect x="740" y="370" width="120" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="800" y="395" text-anchor="middle" fill="#92400e" font-size="12">Orchestrator</text>

  <!-- 4 Domain Agents -->
  <rect x="610" y="480" width="80" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="650" y="505" text-anchor="middle" fill="#166534" font-size="10">采购 Agent</text>

  <rect x="700" y="480" width="80" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="740" y="505" text-anchor="middle" fill="#166534" font-size="10">库存 Agent</text>

  <rect x="820" y="480" width="80" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="860" y="505" text-anchor="middle" fill="#166534" font-size="10">质量 Agent</text>

  <rect x="910" y="480" width="80" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="950" y="505" text-anchor="middle" fill="#166534" font-size="10">生产 Agent</text>

  <!-- Tool Engine (SQLite) -->
  <rect x="440" y="570" width="120" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="595" text-anchor="middle" fill="#475569" font-size="12">工具引擎 (SQLite)</text>

  <!-- Milvus -->
  <rect x="30" y="570" width="100" height="40" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="80" y="595" text-anchor="middle" fill="#6b21a8" font-size="12">Milvus</text>

  <!-- Redis -->
  <rect x="150" y="570" width="80" height="40" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="190" y="595" text-anchor="middle" fill="#6b21a8" font-size="12">Redis</text>

  <!-- PostgreSQL -->
  <rect x="250" y="570" width="90" height="40" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="295" y="595" text-anchor="middle" fill="#6b21a8" font-size="12">PostgreSQL</text>

  <!-- ====== Labels ====== -->
  <!-- Intent labels near router outputs -->
  <text x="320" y="340" fill="#3b82f6" font-size="10">RAG 查询</text>
  <text x="480" y="340" fill="#22c55e" font-size="10">工具调用</text>
  <text x="580" y="340" fill="#f59e0b" font-size="10">目标编排</text>

  <!-- Orchestrator label -->
  <text x="690" y="465" fill="#f59e0b" font-size="9">Plan → Execute → Summarize</text>

  <!-- Legend -->
  <rect x="30" y="640" width="280" height="75" rx="4" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <text x="45" y="662" fill="#475569" font-size="11" font-weight="600">图例</text>
  <rect x="45" y="674" width="14" height="10" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="65" y="684" fill="#64748b" font-size="9">RAG 路径</text>
  <rect x="130" y="674" width="14" height="10" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/><text x="150" y="684" fill="#64748b" font-size="9">编排路径</text>
  <rect x="215" y="674" width="14" height="10" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/><text x="235" y="684" fill="#64748b" font-size="9">工具路径</text>
  <rect x="45" y="694" width="14" height="10" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="2,1"/><text x="65" y="704" fill="#64748b" font-size="9">横切关注点</text>

  <!-- Title -->
  <text x="480" y="790" text-anchor="middle" fill="#94a3b8" font-size="10">SmartQA Agentic 架构 — Orchestrator + 4 专域 Agent + 工具绑定</text>
</svg>
