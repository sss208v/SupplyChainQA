<svg width="1000" height="800" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a-s" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b82f6"/></marker>
    <marker id="a-g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
    <marker id="a-p" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a855f7"/></marker>
    <marker id="a-o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/></filter>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px} .t{font-size:15px;font-weight:600;fill:#1e293b} .s{font-size:11px;fill:#64748b} .xs{font-size:9px;fill:#94a3b8}</style>
  </defs>
  <rect width="1000" height="800" fill="#f8fafc" rx="6"/>

  <!-- ===== Lines (drawn first, behind boxes) ===== -->
  <line x1="500" y1="50" x2="500" y2="84" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#a-s)"/>
  <line x1="500" y1="132" x2="500" y2="170" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a-b)"/>
  <line x1="500" y1="220" x2="500" y2="256" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a-g)"/>

  <!-- Router → 3 branches -->
  <line x1="450" y1="306" x2="160" y2="368" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a-b)"/>
  <line x1="500" y1="306" x2="500" y2="368" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a-g)"/>
  <line x1="550" y1="306" x2="840" y2="368" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#a-o)"/>

  <!-- Orchestrator → 4 Agents -->
  <line x1="780" y1="418" x2="560" y2="472" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#a-o)"/>
  <line x1="820" y1="418" x2="680" y2="472" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#a-o)"/>
  <line x1="860" y1="418" x2="800" y2="472" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#a-o)"/>
  <line x1="900" y1="418" x2="920" y2="472" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#a-o)"/>

  <!-- RAG → DBs -->
  <line x1="130" y1="418" x2="80" y2="560" stroke="#a855f7" stroke-width="1.5" marker-end="url(#a-p)"/>
  <line x1="160" y1="418" x2="160" y2="560" stroke="#a855f7" stroke-width="1.5" marker-end="url(#a-p)"/>
  <line x1="190" y1="418" x2="250" y2="560" stroke="#a855f7" stroke-width="1.5" marker-end="url(#a-p)"/>

  <!-- TOOL → SQLite -->
  <line x1="500" y1="418" x2="500" y2="560" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a-g)"/>

  <!-- Agents → SQLite -->
  <line x1="560" y1="520" x2="480" y2="558" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="680" y1="520" x2="520" y2="558" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="800" y1="520" x2="520" y2="558" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="920" y1="520" x2="520" y2="558" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ===== RBAC cross-cutting ===== -->
  <rect x="620" y="578" width="340" height="38" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="790" y="602" text-anchor="middle" fill="#dc2626" font-size="12">RBAC 权限层（横切关注点：7 部门角色 + security_group 数组列）</text>
  <line x1="440" y1="597" x2="618" y2="597" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ===== Components ===== -->
  <!-- User -->
  <rect x="420" y="10" width="160" height="40" rx="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="35" text-anchor="middle" fill="#475569" font-size="13">用户（浏览器）</text>

  <!-- Vue3 -->
  <rect x="400" y="92" width="200" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="117" text-anchor="middle" fill="#1e40af" class="t">Vue3 前端（端口 3000）</text>

  <!-- FastAPI -->
  <rect x="400" y="180" width="200" height="40" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="205" text-anchor="middle" fill="#166534" class="t">FastAPI 后端（端口 8001）</text>

  <!-- Router -->
  <rect x="380" y="266" width="240" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="291" text-anchor="middle" fill="#92400e" class="t">意图路由器（规则 → 语义 → LLM）</text>

  <!-- RAG Agent -->
  <rect x="100" y="378" width="120" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="403" text-anchor="middle" fill="#1e40af" font-size="12">RAG Agent</text>

  <!-- Tool Agent -->
  <rect x="440" y="378" width="120" height="40" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="403" text-anchor="middle" fill="#166534" font-size="12">Tool Agent</text>

  <!-- Orchestrator -->
  <rect x="780" y="378" width="120" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="840" y="403" text-anchor="middle" fill="#92400e" font-size="12">Orchestrator</text>

  <!-- 4 Domain Agents — evenly spaced -->
  <rect x="510" y="480" width="90" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="555" y="505" text-anchor="middle" fill="#166534" font-size="11">采购Agent</text>

  <rect x="630" y="480" width="90" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="675" y="505" text-anchor="middle" fill="#166534" font-size="11">库存Agent</text>

  <rect x="750" y="480" width="90" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="795" y="505" text-anchor="middle" fill="#166534" font-size="11">质量Agent</text>

  <rect x="870" y="480" width="90" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="915" y="505" text-anchor="middle" fill="#166534" font-size="11">生产Agent</text>

  <!-- Tool Engine -->
  <rect x="450" y="568" width="100" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="500" y="589" text-anchor="middle" fill="#475569" font-size="11">工具引擎 (SQLite)</text>

  <!-- Milvus -->
  <rect x="30" y="568" width="90" height="32" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="75" y="589" text-anchor="middle" fill="#6b21a8" font-size="11">Milvus</text>

  <!-- Redis -->
  <rect x="135" y="568" width="70" height="32" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="170" y="589" text-anchor="middle" fill="#6b21a8" font-size="11">Redis</text>

  <!-- PostgreSQL -->
  <rect x="220" y="568" width="86" height="32" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="263" y="589" text-anchor="middle" fill="#6b21a8" font-size="11">PostgreSQL</text>

  <!-- ===== Labels ===== -->
  <text x="320" y="350" fill="#3b82f6" font-size="10">RAG 查询</text>
  <text x="498" y="350" fill="#22c55e" font-size="10">工具调用</text>
  <text x="590" y="350" fill="#f59e0b" font-size="10">目标编排（GOAL）</text>

  <text x="700" y="470" fill="#f59e0b" font-size="9">Plan → Execute → Summarize</text>

  <!-- Legend -->
  <rect x="30" y="640" width="290" height="68" rx="4" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="46" y="660" fill="#475569" font-size="11" font-weight="600">图例</text>
  <rect x="46" y="672" width="14" height="10" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="66" y="681" fill="#64748b" font-size="9">RAG 路径</text>
  <rect x="130" y="672" width="14" height="10" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/><text x="150" y="681" fill="#64748b" font-size="9">编排路径（GOAL）</text>
  <rect x="255" y="672" width="14" height="10" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/><text x="275" y="681" fill="#64748b" font-size="9">工具路径</text>
  <rect x="46" y="690" width="14" height="10" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="2,1"/><text x="66" y="699" fill="#64748b" font-size="9">横切关注点（RBAC）</text>

  <!-- Footer -->
  <text x="500" y="780" text-anchor="middle" fill="#94a3b8" font-size="10">SmartQA Agentic v2.0 — Orchestrator + 4 专域 Agent + 工具绑定</text>
</svg>
