<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartQA Pro · AI 面试陪练</title>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #e6edf3; --text2: #8b949e; --accent: #58a6ff;
  --green: #3fb950; --orange: #d2991d; --red: #f85149;
  --purple: #a371f7;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'SF Mono', 'Cascadia Code', 'Consolas', 'Microsoft YaHei', monospace; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
/* SIDEBAR */
.sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
.sidebar h2 { font-size: 16px; margin-bottom: 4px; }
.sidebar .sub { font-size: 11px; color: var(--text2); margin-bottom: 24px; }
.sidebar .mode-btn { display: block; width: 100%; padding: 10px 14px; margin-bottom: 6px; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; cursor: pointer; text-align: left; transition: all .15s; font-family: inherit; }
.sidebar .mode-btn:hover { border-color: var(--accent); background: rgba(88,166,255,.06); }
.sidebar .mode-btn.active { border-color: var(--accent); background: rgba(88,166,255,.12); color: var(--accent); }
.sidebar .section-label { font-size: 10px; text-transform: uppercase; color: var(--text2); margin: 16px 0 8px; letter-spacing: 1px; }
.topic-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.topic-tag { padding: 3px 10px; border: 1px solid var(--border); border-radius: 12px; font-size: 11px; cursor: pointer; background: transparent; color: var(--text2); font-family: inherit; transition: all .15s; }
.topic-tag:hover { border-color: var(--accent); color: var(--text); }
.topic-tag.active { background: rgba(88,166,255,.15); border-color: var(--accent); color: var(--accent); }
/* Stats */
.stats { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
.stat-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
.stat-row span:first-child { color: var(--text2); }
.stat-row .val { color: var(--accent); font-weight: 600; }
.stat-row .val.good { color: var(--green); }
.stat-row .val.warn { color: var(--orange); }

/* MAIN */
.main { flex:1; display: flex; flex-direction: column; }
.header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 16px; font-weight: 600; }
.header .status { font-size: 11px; display: flex; align-items: center; gap: 6px; }
.header .status .dot { width: 8px; height: 8px; border-radius: 50%; }
.header .status .dot.on { background: var(--green); }
.header .status .dot.off { background: var(--red); }
.chat-area { flex:1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 80%; padding: 12px 16px; border-radius: 8px; font-size: 13px; line-height: 1.6; animation: fadeIn .3s; }
@keyframes fadeIn { from {opacity:0;transform:translateY(8px)} to {opacity:1;transform:translateY(0)} }
.msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
.msg.user { align-self: flex-end; background: rgba(88,166,255,.1); border: 1px solid rgba(88,166,255,.3); }
.msg.system { align-self: center; font-size: 11px; color: var(--text2); padding: 4px 12px; border: 1px dashed var(--border); border-radius: 16px; }
.msg .role { font-size: 10px; color: var(--accent); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
.msg .score { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-top: 6px; font-weight: 600; }
.score.high { background: rgba(63,185,80,.15); color: var(--green); }
.score.mid { background: rgba(210,153,29,.15); color: var(--orange); }
.score.low { background: rgba(248,81,73,.15); color: var(--red); }
.score.pending { background: rgba(88,166,255,.1); color: var(--accent); }
.input-area { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; }
.input-area textarea { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 13px; font-family: inherit; resize: none; min-height: 44px; max-height: 120px; outline: none; }
.input-area textarea:focus { border-color: var(--accent); }
.input-area button { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 600; white-space: nowrap; }
.input-area button:disabled { opacity: .4; cursor: not-allowed; }
.input-area button:hover:not(:disabled) { background: #4090e0; }
.timer { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; padding: 8px; }
.timer.warn { color: var(--orange); }
.timer.danger { color: var(--red); animation: pulse .5s infinite alternate; }
@keyframes pulse { to { opacity: .5; } }
.typing { display: flex; gap: 4px; padding: 12px 16px; }
.typing span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0) } 30% { transform: translateY(-6px) } }
.mode-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; background: rgba(163,113,247,.15); color: var(--purple); margin-right: 8px; }
</style>
</head>
<body>

<nav class="sidebar">
  <h2>🎯 SmartQA Coach</h2>
  <div class="sub">AI 面试陪练 v1.0</div>

  <button class="mode-btn active" data-mode="mock" onclick="switchMode('mock')">🤖 模拟面试</button>
  <button class="mode-btn" data-mode="drill" onclick="switchMode('drill')">⚡ 快速训练</button>

  <div class="section-label">重点模块</div>
  <div class="topic-tags" id="topicTags">
    <button class="topic-tag active" data-topic="all" onclick="selectTopic('all')">全部</button>
    <button class="topic-tag" data-topic="rag" onclick="selectTopic('rag')">RAG 检索</button>
    <button class="topic-tag" data-topic="agent" onclick="selectTopic('agent')">Agent 架构</button>
    <button class="topic-tag" data-topic="rbac" onclick="selectTopic('rbac')">权限控制</button>
    <button class="topic-tag" data-topic="arch" onclick="selectTopic('arch')">系统架构</button>
    <button class="topic-tag" data-topic="eval" onclick="selectTopic('eval')">评估指标</button>
  </div>

  <div class="stats">
    <div class="stat-row"><span>API Key</span><span class="val" id="keyStatus" style="font-size:10px">未设置</span></div>
    <div class="stat-row"><span>已练习</span><span class="val" id="statTotal">0 题</span></div>
    <div class="stat-row"><span>平均分</span><span class="val" id="statAvg">--</span></div>
    <div class="stat-row"><span>待攻克</span><span class="val warn" id="statWeak">0 题</span></div>
    <button style="margin-top:12px;width:100%;padding:8px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:11px;cursor:pointer;font-family:inherit" onclick="resetProgress()">重置进度</button>
    <a href="interview-showcase.html" style="display:block;margin-top:8px;padding:8px;text-align:center;color:var(--text2);font-size:11px;text-decoration:none;border:1px solid var(--border);border-radius:6px">📖 查看面试展示页</a>
  </div>
</nav>

<div class="main">
  <header class="header">
    <h1><span class="mode-badge" id="modeBadge">模拟面试</span>AI Interview Coach</h1>
    <div class="status">
      <span id="apiStatus">DeepSeek API</span>
    </div>
  </header>

  <div class="chat-area" id="chatArea">
    <div class="msg system">👋 欢迎使用 AI 面试陪练！选择一个模式开始。</div>
    <div class="msg assistant">
      <div class="role">🤖 面试官</div>
      你好！我是你的专属 AI 面试教练。<br><br>
      我会根据 SmartQA Pro 项目的真实面试内容提问，听你回答后给出评分和改进建议。<br><br>
      📌 <strong>模拟面试</strong>：我会逐题提问，评估你的回答<br>
      ⚡ <strong>快速训练</strong>：选择一个模块，快速刷题积累经验<br>
      💬 <strong>自由问答</strong>：对项目有任何疑问，随时问我<br><br>
      准备好了就说「<strong>开始</strong>」😊
    </div>
  </div>

  <div class="input-area">
    <textarea id="userInput" placeholder="输入你的回答..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
</div>

<script>
// ===== CONFIG =====
const DEEPSEEK_URL = 'https://api.deepseek.com/v1';
let DEEPSEEK_KEY = localStorage.getItem('coach_ds_key') || '';

// ===== STATE =====
let mode = 'mock';
let topic = 'all';
let interviewActive = false;
let currentQuestions = [];
let questionIndex = 0;
let scores = [];
let timerInterval = null;
let timeLeft = 0;
let apiOnline = false;

// ===== PROJECT KNOWLEDGE (condensed from interview-showcase.html) =====
const PROJECT_KNOWLEDGE = `你是 SmartQA Pro 项目的 AI 面试教练。以下是项目的核心信息，你必须基于这些真实信息提问和评估：

【项目概况】
SmartQA Pro — 面向制造业供应链的企业级智能问答系统。技术栈：Vue3+Pinia+Vite 前端，FastAPI+LangChain+LangGraph 后端，Milvus 向量库(512维/BGE-small-zh-v1.5)，Redis 缓存，PostgreSQL 数据库，DeepSeek API 作 LLM，Neo4j 图数据库。

【核心功能】
1. RAG 混合检索：BM25关键词 + Milvus向量 → RRF融合(K=60) → Self-RAG过滤 → BGE-Reranker-v2-m3精排 → 冲突检测。覆盖2425个chunk，7部门文档。CP=0.67（16条RAGAS评估平均）。
2. Agent 架构：Orchestrator + 4个专域Agent(采购/库存/质量/生产)。AGENT_TYPE三选一：ToolAgent(LangGraph ReAct,默认)/LangGraphAgent(Router→Tool→Observe→Decide循环)/LangChainAgent(AgentExecutor)。6个工具：query_inventory/query_order/create_ticket/get_datetime/get_knowledge/query_supplier。LangChain作公共底座(LLM+bind_tools)，LangGraph作编排层。
3. 三级意图路由：规则匹配(<1ms,零token) → 语义路由(<10ms,零token) → LLM分类(~2.5s,兜底)。90%请求零token覆盖。
4. RBAC行级权限：7角色(admin/purchase/warehouse/quality/production/finance/logistics)。Milvus ARRAY security_group实现数据库层过滤。
5. SSE流式输出：三事件流(tool_status→text→done)。操作审批(create_ticket需前端确认)。Token成本实时追踪。
6. 智能追问(clarify)：参数缺失时不硬猜，主动反问收集信息。Redis保持对话上下文。
7. 容错重试：LLM流式调用指数退避(2s→4s→8s,最多3次,只在首个token前重试)。Milvus检索固定间隔1s重试。
8. HyDE(假设文档嵌入)：模糊问题先生成假设文档再检索。
9. Query Cache：MD5哈希+Redis TTL+LRU淘汰。
10. 父子文档：小chunk精确匹配→大chunk提供上下文。
11. 多源冲突检测：正则提取实体+数值→同实体不同数值标记→SSE推送+追加到LLM context。
12. ToolMetrics：1000条环形缓冲区，per-tool统计调用次数/成功率/平均耗时。
13. Neo4j图谱：6种Label(Material/Supplier/PurchaseOrder/OrderLine/StockMove/Ticket)，4种关系。从SQLite同步。
14. 文档解析三阶回退链：opendataloader→pymupdf4llm→pdfplumber。

【评估数据】
- 工具调用成功率：20/20 (100%)
- 工具调用P50延迟：1550ms, P95: 3200ms
- RAGAS Context Precision：0.67
- 检索响应率：73.3% (30条测试集,22条响应)
- pytest：81 passed, 1 skipped

【面试话术要点】
- "零token优先"是架构设计中的成本意识
- "LangChain管LLM调用和工具绑定，LangGraph管状态流转"
- "流式retry只在第一个token前重试——因为用户已经看到部分结果"
- "冲突检测是RAG质量保障的最后一道防线——不修复矛盾，只标注矛盾"
- "每个retry决策都能说清楚trade-off"
- "用RRF而非加权求和——因为BM25和向量的score量纲不同"`;

// ===== QUESTIONS BY TOPIC =====
const QUESTION_BANK = {
  rag: [
    "SmartQA 的 RAG 检索链路有几层过滤？每层的作用是什么？",
    "为什么用 RRF 融合而不是加权求和？RRF 的 K 值设为多少？",
    "HyDE 是什么？在 SmartQA 里怎么用的？解决什么问题？",
    "Self-RAG 和 Reranker 有什么区别？各自在哪一步起作用？",
    "Query Cache 怎么实现的？缓存键怎么生成？",
    "父子文档策略是什么？为什么不直接存大 chunk？",
    "文档解析的三阶回退链是什么？为什么这么设计？",
    "冲突检测是怎么工作的？为什么说'不修复矛盾，只标注矛盾'？",
    "RAGAS Context Precision 0.67 是怎么测出来的？这个数字意味着什么？",
    "RRF 融合后的四层后处理各是什么？为什么 Jaccard 去重只比相邻 3 条？",
  ],
  agent: [
    "SmartQA 支持哪三种 Agent 模式？各自在什么场景下用？",
    "ReAct 循环的退出条件有哪些？怎么防止无限循环？",
    "Orchestrator-Worker 模式下，4 个专域 Agent 怎么分工？",
    "LangGraph 的 StateGraph 在 SmartQA 里怎么用的？ToolNode 怎么自动执行工具？",
    "手写 ReAct vs LangChain Agent vs LangGraph Agent，面试时怎么说各自优势？",
    "6 个供应链工具分别是什么？各自对应什么后端数据？",
    "Agent 的工具选择怎么做到可靠？SmartQA 做了哪些措施？",
    "ToolMetrics 怎么收集的？为什么用环形缓冲区而不是 Prometheus？",
  ],
  rbac: [
    "SmartQA 的 RBAC 有几层？每层负责什么？",
    "Milvus 的 security_group ARRAY 怎么实现行级过滤？",
    "为什么说'PostgreSQL 负责认证，Milvus 只负责过滤'是职责分离？",
    "权限过滤在哪个环节执行？如果放在应用层 if-else 有什么问题？",
    "7 个部门角色分别是什么？新增一个角色需要改代码吗？",
  ],
  arch: [
    "SmartQA 的整体架构分几层？数据怎么从前端流到 LLM 再回来？",
    "三级意图路由每一级的延迟是多少？为什么说'零 token 优先'？",
    "SSE 流式输出的三事件流是什么？为什么用 SSE 而不是 WebSocket？",
    "操作审批(approval)机制怎么实现的？为什么 create_ticket 需要审批？",
    "clarify 追问机制怎么判断需要追问？追问时怎么保持上下文？",
    "流式 retry 怎么做？技术难点在哪？为什么不直接在装饰器里包？",
    "Docker Compose 管理了哪些服务？为什么选这些基础设施？",
    "后端启动时做了哪些初始化？启动顺序为什么要那样？",
  ],
  eval: [
    "SmartQA 的评估体系有哪几层？各自测什么？",
    "工具调用 20 次全成功怎么测的？如何复现？",
    "RAGAS 评估的三大指标是什么？各自含义？",
    "为什么说'R@K 和 MRR 受 ground truth 规模影响大'？你怎么应对？",
    "benchmark 脚本覆盖了几个工具？P50/P95/P99 各是多少？",
  ],
};

// ===== MODE SWITCHING =====
function switchMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-mode="${m}"]`).classList.add('active');
  document.getElementById('modeBadge').textContent = {mock:'模拟面试',drill:'快速训练',free:'自由问答'}[m];
  stopTimer();
  interviewActive = false;
  currentQuestions = [];
  questionIndex = 0;
  if (m === 'mock') {
    addMsg('system', '切换到「模拟面试」模式。我会逐题提问，评估你的回答。说「开始」启动面试。');
  } else if (m === 'drill') {
    addMsg('system', '切换到「快速训练」模式。选择一个模块，我来快速出题。说「开始」或选一个话题标签。');
  } else {
    addMsg('system', '切换到「自由问答」模式。对 SmartQA 项目有任何疑问，随时问我。');
  }
}

function selectTopic(t) {
  topic = t;
  document.querySelectorAll('.topic-tag').forEach(tag => tag.classList.remove('active'));
  document.querySelector(`[data-topic="${t}"]`).classList.add('active');
  addMsg('system', `已选择模块：${t === 'all' ? '全部' : document.querySelector(`[data-topic="${t}"]`).textContent}`);
}

// ===== CHAT =====
function addMsg(role, content) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (role === 'assistant') div.innerHTML = `<div class="role">🤖 面试官</div>${content}`;
  else if (role === 'system') div.textContent = content;
  else div.innerHTML = content;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function addTyping() {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

let evalMsgDiv = null;
function startEvalMsg() {
  evalMsgDiv = addMsg('assistant', '⏳ 正在评估你的回答...');
}
function updateEvalMsg(html) {
  if (evalMsgDiv) evalMsgDiv.innerHTML = `<div class="role">🤖 面试官</div>${html}`;
}

// ===== API CALL =====
async function callLLM(systemPrompt, userMessage) {
  if (!DEEPSEEK_KEY) {
    const key = prompt('请设置 DeepSeek API Key（sk-...）：');
    if (!key) throw new Error('未设置 API Key');
    DEEPSEEK_KEY = key;
    localStorage.setItem('coach_ds_key', key);
    document.getElementById('keyStatus').textContent = '已设置 ✅';
  }
  const resp = await fetch(`${DEEPSEEK_URL}/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${DEEPSEEK_KEY}` },
    body: JSON.stringify({
      model: 'deepseek-chat',
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userMessage },
      ],
      temperature: 0.7,
      max_tokens: 1024,
    }),
    signal: AbortSignal.timeout(30000),
  });
  if (!resp.ok) {
    const err = await resp.text();
    if (resp.status === 401) { localStorage.removeItem('coach_ds_key'); DEEPSEEK_KEY = ''; }
    throw new Error(`API ${resp.status}: ${err.substring(0,100)}`);
  }
  const data = await resp.json();
  return data.choices?.[0]?.message?.content || JSON.stringify(data);
}

// ===== SEND MESSAGE =====
async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';

  addMsg('user', text);

  if (mode === 'free') {
    addTyping();
    try {
      const reply = await callLLM(
        PROJECT_KNOWLEDGE + '\n\n你现在是自由问答模式。用户会问关于 SmartQA Pro 项目的问题。请简洁准确地回答。如果用户问的内容不在项目范围内，诚实说明。',
        text
      );
      removeTyping();
      addMsg('assistant', reply);
    } catch (e) {
      removeTyping();
      addMsg('system', '❌ 请求失败：' + e.message);
    }
    return;
  }

  if (mode === 'mock') {
    if (!interviewActive && (text.includes('开始') || text.toLowerCase().includes('start'))) {
      startMockInterview();
      return;
    }
    if (!interviewActive) {
      addMsg('system', '面试还没开始。说「开始」启动模拟面试。');
      return;
    }
    // Evaluate answer
    await evaluateAnswer(text);
    // Next question
    setTimeout(() => askNextQuestion(), 1500);
  }

  if (mode === 'drill') {
    if (!interviewActive && (text.includes('开始') || text.toLowerCase().includes('start'))) {
      startDrill();
      return;
    }
    if (!interviewActive) {
      addMsg('system', '训练还没开始。说「开始」或选一个模块标签。');
      return;
    }
    await evaluateAnswer(text);
    setTimeout(() => askNextQuestion(), 1000);
  }
}

// ===== MOCK INTERVIEW =====
function startMockInterview() {
  interviewActive = true;
  scores = [];
  currentQuestions = [];
  questionIndex = 0;

  // Collect questions from selected topic
  if (topic === 'all') {
    Object.values(QUESTION_BANK).forEach(arr => currentQuestions.push(...arr));
  } else {
    currentQuestions = [...(QUESTION_BANK[topic] || [])];
  }
  // Shuffle
  for (let i = currentQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
  }
  // Pick 8 questions
  currentQuestions = currentQuestions.slice(0, 8);

  addMsg('system', `🎯 模拟面试开始！共 ${currentQuestions.length} 题，每题 2 分钟。准备好了吗？`);
  setTimeout(() => askNextQuestion(), 1500);
}

function startDrill() {
  interviewActive = true;
  scores = [];
  currentQuestions = [];
  questionIndex = 0;

  if (topic === 'all') {
    Object.values(QUESTION_BANK).forEach(arr => currentQuestions.push(...arr));
  } else {
    currentQuestions = [...(QUESTION_BANK[topic] || [])];
  }
  for (let i = currentQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
  }

  addMsg('system', `⚡ 快速训练开始！共 ${currentQuestions.length} 题，不限时。准备好了吗？`);
  setTimeout(() => askNextQuestion(), 1000);
}

function askNextQuestion() {
  if (questionIndex >= currentQuestions.length) {
    endSession();
    return;
  }
  const q = currentQuestions[questionIndex];
  questionIndex++;
  addMsg('assistant', `<strong>第 ${questionIndex}/${currentQuestions.length} 题：</strong><br><br>${q}`);
  startTimer(mode === 'mock' ? 120 : 0);
}

async function evaluateAnswer(answer) {
  stopTimer();
  startEvalMsg();

  const question = currentQuestions[questionIndex - 1];
  const evalPrompt = `你正在评估面试者对以下问题的回答。

【问题】${question}
【面试者回答】${answer}

请给出：
1. 评分（1-5分，5=完美）
2. 简短评语（1-2句话，指出亮点和不足）
3. 改进建议（1句话）

请用以下格式回复（不要加额外内容）：
分数: X
评语: xxx
建议: xxx`;

  try {
    const reply = await callLLM(PROJECT_KNOWLEDGE + '\n\n' + evalPrompt, '请评估以上回答。');
    const scoreMatch = reply.match(/分数:\s*(\d)/);
    const commentMatch = reply.match(/评语:\s*(.+)/);
    const suggestMatch = reply.match(/建议:\s*(.+)/);

    const score = scoreMatch ? parseInt(scoreMatch[1]) : 3;
    const comment = commentMatch ? commentMatch[1] : reply;
    const suggest = suggestMatch ? suggestMatch[1] : '';

    scores.push({ question, answer, score, comment, suggest });

    const scoreClass = score >= 4 ? 'high' : score >= 3 ? 'mid' : 'low';
    let html = `<strong>评分：</strong><span class="score ${scoreClass}">${score}/5</span><br>`;
    html += `<strong>评语：</strong>${comment}<br>`;
    if (suggest) html += `<strong>💡 建议：</strong>${suggest}`;
    html += `<br><br><em>下一题准备中...</em>`;
    updateEvalMsg(html);
  } catch (e) {
    updateEvalMsg(`⚠️ 评估失败：${e.message}<br><br>已记录回答，继续下一题...`);
    scores.push({ question, answer, score: 0, comment: '评估失败', suggest: '' });
  }

  saveProgress();
  updateStats();
}

function endSession() {
  interviewActive = false;
  const avg = scores.length > 0 ? (scores.reduce((a,b) => a + b.score, 0) / scores.length).toFixed(1) : 0;
  const weak = scores.filter(s => s.score < 3);
  addMsg('system', `🏁 面试结束！`);
  let summary = `<strong>📊 成绩汇总</strong><br><br>`;
  summary += `完成 ${scores.length} 题 | 平均分 <span class="score ${avg >= 4 ? 'high' : avg >= 3 ? 'mid' : 'low'}">${avg}/5</span><br><br>`;
  if (weak.length > 0) {
    summary += `<strong>🔴 待加强：</strong><br>`;
    weak.forEach(w => { summary += `• ${w.question.substring(0,40)}... <span class="score low">${w.score}/5</span><br>`; });
  } else {
    summary += '✅ 全部题目表现良好！';
  }
  addMsg('assistant', summary);
  saveProgress();
  updateStats();
}

// ===== TIMER =====
function startTimer(seconds) {
  stopTimer();
  if (seconds <= 0) return;
  timeLeft = seconds;
  const timerDiv = document.createElement('div');
  timerDiv.className = 'timer';
  timerDiv.id = 'timerDisplay';
  document.getElementById('chatArea').appendChild(timerDiv);
  updateTimerDisplay();

  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      stopTimer();
      addMsg('system', '⏰ 时间到！');
    }
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  if (!el) return;
  const min = Math.floor(timeLeft / 60);
  const sec = timeLeft % 60;
  el.textContent = `${min}:${sec.toString().padStart(2, '0')}`;
  el.className = 'timer' + (timeLeft < 30 ? ' danger' : timeLeft < 60 ? ' warn' : '');
}

function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  const el = document.getElementById('timerDisplay');
  if (el) el.remove();
}

// ===== PERSISTENCE =====
function saveProgress() {
  const data = {
    scores,
    totalPracticed: (parseInt(localStorage.getItem('coach_total') || '0')) + (scores.length > 0 ? 1 : 0),
    totalScore: scores.reduce((a,b) => a + b.score, 0),
    count: scores.length,
  };
  localStorage.setItem('coach_progress', JSON.stringify(data));
}

function loadProgress() {
  try {
    return JSON.parse(localStorage.getItem('coach_progress') || '{}');
  } catch { return {}; }
}

function updateStats() {
  const p = loadProgress();
  document.getElementById('statTotal').textContent = (p.totalPracticed || 0) + ' 题';
  if (p.count > 0) {
    document.getElementById('statAvg').textContent = (p.totalScore / p.count).toFixed(1) + '/5';
  }
  const weakCount = scores.filter(s => s.score < 3).length;
  document.getElementById('statWeak').textContent = weakCount + ' 题';
}

function resetProgress() {
  if (confirm('确定要重置所有进度吗？')) {
    localStorage.removeItem('coach_progress');
    scores = [];
    updateStats();
    addMsg('system', '✅ 进度已重置');
  }
}

// ===== API CONNECTION CHECK =====
async function checkAPI() {
  try {
    const resp = await fetch(`${API_BASE}/auth/health`, { signal: AbortSignal.timeout(3000) });
    if (resp.ok) {
      apiOnline = true;
      document.getElementById('apiDot').className = 'dot on';
      document.getElementById('apiStatus').textContent = 'SmartQA 后端在线';
      return;
    }
  } catch(e) {}
  apiOnline = false;
  document.getElementById('apiDot').className = 'dot off';
  document.getElementById('apiStatus').textContent = '后端离线 · 直连 DeepSeek';
}

// ===== INIT =====
function init() {
  const ta = document.getElementById('userInput');
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  });

  if (DEEPSEEK_KEY) {
    document.getElementById('keyStatus').textContent = '已设置 ✅';
  }

  updateStats();
}

init();
</script>
