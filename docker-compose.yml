services:
  # ==========================================
  # Supply Chain QA 后端服务
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supply-chain-qa-backend
    ports:
      - "8001:8001"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=15432
      - POSTGRES_USER=supply_chain_qa
      - POSTGRES_PASSWORD=scqa1234
      - POSTGRES_DB=supply_chain_qa
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=scqa1234
    volumes:
      - ./backend/app/data:/app/app/data:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==========================================
  # Supply Chain QA 前端服务
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8001
    container_name: supply-chain-qa-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ==========================================
  # Milvus 向量数据库 (Standalone模式)
  # ==========================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: supply-chain-qa-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: supply-chain-qa-minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.3.4
    container_name: supply-chain-qa-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # ==========================================
  # Redis 缓存 & 对话记忆
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: supply-chain-qa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # PostgreSQL 元数据存储
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: supply-chain-qa-postgres
    command: ["postgres", "-c", "port=15432"]
    environment:
      POSTGRES_USER: supply_chain_qa
      POSTGRES_PASSWORD: scqa1234
      POSTGRES_DB: supply_chain_qa
      PGPORT: 15432
    ports:
      - "15432:15432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supply_chain_qa -p 15432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Attu - Milvus可视化管理工具
  # ==========================================
  attu:
    image: zilliz/attu:v2.3.4
    container_name: supply-chain-qa-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8000:3000"
    depends_on:
      - milvus

  # ==========================================
  # RedisInsight - Redis可视化管理工具
  # ==========================================
  redisinsight:
    image: redis/redisinsight:latest
    container_name: supply-chain-qa-redisinsight
    ports:
      - "5541:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis

  # ==========================================
  # Neo4j 图数据库 — 实体关系图谱检索
  # ==========================================
  neo4j:
    image: neo4j:5-community
    container_name: supply-chain-qa-neo4j
    ports:
      - "7474:7474"    # HTTP (Browser)
      - "17687:7687"   # Bolt (Driver, 外部 17687 避免冲突)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-scqa1234}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures__unrestricted: apoc.*
      NEO4J_server_config_strict__validation_enabled: "false"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "scqa1234", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Langfuse - LLM 可观测性平台（本地自托管）
  # ==========================================
  langfuse-db:
    image: postgres:15-alpine
    container_name: supply-chain-qa-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse123
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    container_name: supply-chain-qa-langfuse
    ports:
      - "3100:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse123@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: scqa-langfuse-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3100
      SALT: scqa-langfuse-salt-change-in-production
      TELEMETRY_ENABLED: "false"
    depends_on:
      langfuse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  redis_data:
  postgres_data:
  redisinsight_data:
  neo4j_data:
  neo4j_logs:
  langfuse_pg_data:
