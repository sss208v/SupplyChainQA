services:
  # ==========================================
  # SmartQA 后端服务
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartqa-backend
    ports:
      - "8001:8001"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=15432
      - POSTGRES_USER=smartqa
      - POSTGRES_PASSWORD=smartqa123
      - POSTGRES_DB=smartqa
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
    volumes:
      # 保持 SQLite 数据文件持久化
      - ./backend/app/data:/app/app/data:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/auth/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==========================================
  # SmartQA 前端服务
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8001
    container_name: smartqa-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ==========================================
  # Milvus 向量数据库 (Standalone模式)
  # ==========================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: smartqa-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: smartqa-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.3.4
    container_name: smartqa-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # ==========================================
  # Redis 缓存 & 对话记忆
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: smartqa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # PostgreSQL 元数据存储
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: smartqa-postgres
    command: ["postgres", "-c", "port=15432"]
    environment:
      POSTGRES_USER: smartqa
      POSTGRES_PASSWORD: smartqa123
      POSTGRES_DB: smartqa
      PGPORT: 15432
    ports:
      - "15432:15432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartqa -p 15432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Attu - Milvus可视化管理工具
  # ==========================================
  attu:
    image: zilliz/attu:v2.3.4
    container_name: smartqa-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8000:3000"
    depends_on:
      - milvus

  # ==========================================
  # RedisInsight - Redis可视化管理工具
  # ==========================================
  redisinsight:
    image: redis/redisinsight:latest
    container_name: smartqa-redisinsight
    ports:
      - "5541:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  redis_data:
  postgres_data:
  redisinsight_data:
