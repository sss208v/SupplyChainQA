# Supply Chain QA - 生产环境部署
# 使用方式: docker-compose -f docker-compose.prod.yml up -d
#
# 与开发版 docker-compose.yml 的区别:
#   1. 后端使用构建镜像（含 embedding 模型预装）
#   2. 不暴露数据库端口到宿主机（安全）
#   3. 前端通过 Nginx 反向代理后端 API
#   4. 添加健康检查和重启策略
#   5. 挂载持久化数据卷

services:
  # ==========================================
  # Nginx 反向代理（统一入口）
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: supply-chain-qa-nginx
    ports:
      - "${PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro  # SSL 证书（可选）
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================
  # Supply Chain QA 后端
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supply-chain-qa-backend
    expose:
      - "8001"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=15432
      - POSTGRES_USER=${DB_USER:-supply_chain_qa}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required, set it in .env}
      - POSTGRES_DB=${DB_NAME:-supply_chain_qa}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD is required, set it in .env}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required, set it in .env}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-not-needed}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-http://llama-cpp:8080/v1}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - EMBEDDING_DEVICE=cpu
      - RERANKER_ENABLED=${RERANKER_ENABLED:-false}
      - DEMO_MODE=false
      - DEMO_SEED_USERS=${DEMO_SEED_USERS:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS is required, do NOT use *}
    volumes:
      - backend_data:/app/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ==========================================
  # Supply Chain QA 前端
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: supply-chain-qa-frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  # ==========================================
  # PostgreSQL
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: supply-chain-qa-postgres
    command: ["postgres", "-c", "port=15432"]
    environment:
      POSTGRES_USER: ${DB_USER:-supply_chain_qa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, set it in .env}
      POSTGRES_DB: ${DB_NAME:-supply_chain_qa}
      PGPORT: 15432
    expose:
      - "15432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-supply_chain_qa} -p 15432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: supply-chain-qa-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Milvus 向量数据库
  # ==========================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: supply-chain-qa-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: supply-chain-qa-minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required, set it in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required, set it in .env}
    expose:
      - "9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.3.4
    container_name: supply-chain-qa-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    expose:
      - "19530"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # ==========================================
  # Neo4j 知识图谱
  # ==========================================
  neo4j:
    image: neo4j:5-community
    container_name: supply-chain-qa-neo4j
    expose:
      - "7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required, set it in .env}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:?NEO4J_PASSWORD is required, set it in .env}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_data:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
  neo4j_logs:
