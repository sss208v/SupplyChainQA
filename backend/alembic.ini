# Alembic Configuration for Supply Chain QA

[alembic]
script_location = alembic
prepend_sys_path = .

# 异步 PostgreSQL 连接（与 app.config.Settings.DATABASE_URL 一致）
sqlalchemy.url = postgresql+asyncpg://supply_chain_qa:scqa123@localhost:15432/supply_chain_qa

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
