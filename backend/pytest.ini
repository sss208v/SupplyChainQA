[pytest]
asyncio_mode = auto
markers =
    integration: tests requiring real LLM API key or Docker services (skipped in CI)
    slow: tests that take longer to run
filterwarnings =
    ignore:.*deprecated in LangChain.*
    ignore:.*LangChainPendingDeprecationWarning
    ignore:.*LangChainDeprecationWarning
    ignore:.*HuggingFaceBgeEmbeddings.*deprecated.*
