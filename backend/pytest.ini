[pytest]
asyncio_mode = auto
testpaths = tests
# 默认跳过需要真实 LLM/Docker 服务的 integration 测试
# CI 或本地需要跑 integration 时显式覆盖：pytest -o addopts="" -m integration
# 覆盖率门槛：低于 70% 时失败（防止新增代码不写测试；当前实测 71.6%）
# 临时绕过：pytest -o addopts="-m not integration" --no-cov
addopts =
    -m "not integration"
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=70
markers =
    integration: tests requiring real LLM API key or Docker services (deselected by default; run with `pytest -o addopts="" -m integration`)
    slow: tests that take longer than usual (still collected by default)
filterwarnings =
    ignore:.*deprecated in LangChain.*
    ignore:.*LangChainPendingDeprecationWarning
    ignore:.*LangChainDeprecationWarning
    ignore:.*HuggingFaceBgeEmbeddings.*deprecated.*
