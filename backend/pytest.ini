[pytest]
asyncio_mode = auto
markers =
    integration: tests requiring real LLM API key or Docker services (skipped in CI)
    slow: tests that take longer to run
filterwarnings =
    ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning
    ignore::langchain_core._api.deprecation.LangChainDeprecationWarning
    ignore:.*HuggingFaceBgeEmbeddings.*deprecated.*:langchain_core._api.deprecation.LangChainDeprecationWarning
    ignore:.*deprecated in LangChain.*
