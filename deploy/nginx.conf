# Supply Chain QA - Nginx 反向代理配置
# 统一入口，前端静态文件 + 后端 API 代理

upstream backend {
    server backend:8001;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # 客户端上传大小限制
    client_max_body_size 50M;

    # 基础安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- L4: 静态资源长缓存 ----
    # vite 构建产物文件名含 content hash（assets/xxx-[hash].js），
    # 内容变更即改名，可安全使用 immutable 强缓存
    location ~* \.(js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico)$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 禁止缓存：确保发版后立即引用新 hash 产物
    location = /index.html {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    # 前端静态文件
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式支持（关键！）
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 健康检查
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # 架构图静态文件
    location /architecture.html {
        proxy_pass http://frontend;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
